[tool.poetry]
name = "cdk-bucket-takeover-scanner"
version = "0.0.1"
description = "A tool that scans a list of AWS accounts for CDK S3 Bucket Takeover Risk"
authors = ["Avishay Bar <avishay.il@gmail.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/avishayil/cdk-bucket-takeover-scanner"
packages = [{ include = "cdk_bucket_takeover_scanner" }]

[tool.poetry.scripts]
cdk-bucket-takeover-scanner = "cdk_bucket_takeover_scanner.cli:main"

[tool.poetry.dependencies]
python = ">=3.10"
boto3 = ">=1.34,<2"

[tool.poetry.group.dev.dependencies]
black = ">=24.4,<26"
isort = ">=5.13,<6"
flake8 = ">=7.1,<8"
yamllint = "*"
pre-commit = "*"
pytest = "*"
pytest-cov = "*"
moto = "*"

[tool.pytest.ini_options]
addopts = "--cov=cdk_bucket_takeover_scanner --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["cdk_bucket_takeover_scanner"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
